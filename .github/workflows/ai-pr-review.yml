name: AI PR Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write  # Needed to post review comment, not used by reviewer

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AI_PR_REVIEW == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/ai-pr-reviewer/requirements.txt

      - name: Generate diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-ext-diff "$BASE_SHA...$HEAD_SHA" > pr_diff.txt

      - name: Run AI PR Reviewer
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python3 tools/ai-pr-reviewer/review_agent.py \
            --diff pr_diff.txt \
            --output review_report.md \
            --json-output review_result.json
          review_exit_code=$?
          echo "exit_code=$review_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post review comment
        if: hashFiles('review_report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agyflow-ai-pr-review -->';
            const report = fs.readFileSync('review_report.md', 'utf8');
            if (report.trim()) {
              const body = marker + '\n## AI PR Review\n\n' + report;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100
                }
              );
              const previous = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );
              const request = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              };
              if (previous) {
                await github.rest.issues.updateComment({
                  ...request,
                  comment_id: previous.id
                });
              } else {
                await github.rest.issues.createComment({
                  ...request,
                  issue_number: context.issue.number
                });
              }
            }

      - name: Fail when reviewer is unavailable
        if: steps.review.outputs.exit_code != '0' && steps.review.outputs.exit_code != '2' && steps.review.outputs.exit_code != '3'
        run: |
          echo "::error::AI PR Reviewer no pudo completar la revisión. Revisar el log del paso anterior."
          exit 1

      - name: Fail on partial review
        if: steps.review.outputs.exit_code == '3'
        run: |
          echo "::error::El diff excede el presupuesto del reviewer. Dividir el PR o definir una revisión alternativa."
          exit 1

      - name: Fail on critical findings
        if: steps.review.outputs.exit_code == '2'
        run: |
          echo "::error::AI PR Reviewer detectó hallazgos críticos. Ver comentario del PR."
          exit 1
