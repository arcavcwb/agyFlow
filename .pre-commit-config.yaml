repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: validate-squad
        name: Validate agyFlow squad
        entry: python3 scripts/validate_squad.py
        language: system
        pass_filenames: false
        always_run: true

      - id: unittest-squad
        name: Run agyFlow unit tests
        entry: python3 -m unittest discover tests -v
        language: system
        pass_filenames: false
        always_run: true
